<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⠀︵⠀𝓑ighug cegs ⠀◌Ⳋ𝅄 | Consulta de Claims</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Quicksand', sans-serif; background-color: #fdf8f5; }
  </style>
</head>
<body class="min-h-screen text-slate-700 p-4 md:p-8">

  <div class="max-w-3xl mx-auto">
    <!-- Cabeçalho -->
    <header class="text-center my-8">
      <h1 class="text-3xl md:text-4xl font-bold text-rose-400 mb-2">⠀︵⠀𝓑ighug cegs ⠀◌Ⳋ𝅄</h1>
      <p class="text-slate-500 text-sm md:text-base">Digite seu @ para consultar seus itens, prazos e status das CEGs em todas as abas!</p>
    </header>

    <!-- Barra de Pesquisa -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-rose-100 flex gap-2 mb-8">
      <input 
        type="text" 
        id="userInput" 
        placeholder="Ex: fbcrisimhere" 
        class="w-full px-4 py-3 rounded-xl bg-rose-50/50 border border-rose-200 focus:outline-none focus:border-rose-400"
        onkeypress="if(event.key === 'Enter') buscarItens()"
      >
      <button 
        onclick="buscarItens()" 
        class="bg-rose-400 hover:bg-rose-500 text-white font-bold px-6 py-3 rounded-xl transition cursor-pointer shrink-0">
        Buscar
      </button>
    </div>

    <!-- Estado de Carregamento -->
    <div id="loading" class="hidden text-center py-8 text-rose-400 font-semibold animate-pulse">
      Procurando seus photocards em todas as abas... 💌
    </div>

    <!-- Resultados -->
    <div id="resultados" class="space-y-4"></div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwsUFQ80dEPIcomPQsXjxJwuzFafNjmcHfT5gBLHL0pmQ4ko3-V0GtB6kPp109VMnVaqg/exec";

    async function buscarItens() {
      const input = document.getElementById("userInput").value.trim();
      const resultadosDiv = document.getElementById("resultados");
      const loading = document.getElementById("loading");

      if (!input) return;

      resultadosDiv.innerHTML = "";
      loading.classList.remove("hidden");

      try {
        const response = await fetch(`${API_URL}?user=${encodeURIComponent(input)}`, {
          method: "GET",
          redirect: "follow"
        });
        
        const dados = await response.json();
        loading.classList.add("hidden");

        if (dados.length === 0) {
          resultadosDiv.innerHTML = `
            <div class="bg-white p-6 rounded-2xl text-center border border-rose-100 text-slate-500">
              Nenhum item encontrado para <strong>${input}</strong>. Verifique se digitou exatamente como está na planilha!
            </div>`;
          return;
        }

        dados.forEach(item => {
          const isTudoPago = item.resumoPago === "Pago";
          const badgeGeral = isTudoPago 
            ? `<span class="bg-emerald-100 text-emerald-700 text-xs font-bold px-3 py-1 rounded-full">✓ Tudo Pago</span>`
            : `<span class="bg-amber-100 text-amber-700 text-xs font-bold px-3 py-1 rounded-full">⏳ Pagamento Pendente</span>`;

          // Monta os bloquinhos de cada prazo/parcela (ex: 20/10, 20/11, 20/12)
          let parcelasHTML = "";
          if (item.parcelas && item.parcelas.length > 0) {
            parcelasHTML = `<div class="grid grid-cols-1 sm:grid-cols-3 gap-2 mt-4 pt-3 border-t border-rose-50">`;
            item.parcelas.forEach(p => {
              const corParcela = p.pago 
                ? "bg-emerald-50/70 border-emerald-200 text-emerald-800" 
                : "bg-amber-50/70 border-amber-200 text-amber-800";
              const iconeParcela = p.pago ? "✓ Pago" : "⏳ A pagar";

              parcelasHTML += `
                <div class="border rounded-xl p-2.5 flex justify-between sm:flex-col sm:items-start items-center ${corParcela}">
                  <span class="text-xs font-semibold opacity-75">📅 Prazo: ${p.prazo}</span>
                  <div class="flex items-center justify-between w-auto sm:w-full mt-0 sm:mt-1 gap-2">
                    <span class="font-bold text-sm">${p.valor}</span>
                    <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-white/80">${iconeParcela}</span>
                  </div>
                </div>
              `;
            });
            parcelasHTML += `</div>`;
          }

          resultadosDiv.innerHTML += `
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-rose-100">
              <div class="flex flex-col md:flex-row justify-between md:items-start gap-2">
                <div>
                  <span class="text-xs font-bold uppercase tracking-wider text-rose-400 bg-rose-50 px-2.5 py-1 rounded-md">${item.ceg}</span>
                  <h3 class="text-lg font-bold text-slate-800 mt-2">Itens: ${item.item}</h3>
                  <p class="text-xs text-slate-400 mt-0.5">Joiner: ${item.user}</p>
                </div>
                <div class="flex flex-col md:items-end justify-between gap-2">
                  ${badgeGeral}
                  <p class="text-xs text-slate-500">📦 <strong>Status:</strong> ${item.statusCeg}</p>
                </div>
              </div>
              ${parcelasHTML}
            </div>
          `;
        });
      } catch (erro) {
        console.error(erro);
        loading.classList.add("hidden");
        resultadosDiv.innerHTML = `
          <div class="bg-red-50 text-red-600 p-4 rounded-xl text-center">
            Erro ao conectar com a planilha. Verifique se publicou uma "Nova versão" em Gerenciar implantações.
          </div>`;
      }
    }
  </script>
</body>
</html>

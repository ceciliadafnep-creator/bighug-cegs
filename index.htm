<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⠀︵⠀𝓑ighug cegs ⠀◌Ⳋ𝅄 | Consulta de Claims</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #fff5f7 0%, #fdf8f5 50%, #f5f0ff 100%);
      overflow-x: hidden;
    }

    /* Animação de entrada em cascata dos cards */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .card-anim {
      animation: fadeInUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
    }

    /* Efeito de expansão suave ao passar o mouse ou focar */
    .ceg-card {
      transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .ceg-card:hover {
      transform: translateY(-5px) scale(1.015);
      box-shadow: 0 20px 35px -10px rgba(244, 114, 182, 0.18);
      border-color: #f9a8d4;
    }

    /* Área expansível de detalhes */
    .detalhes-expand {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.45s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.35s ease, margin-top 0.35s ease, padding-top 0.35s ease;
    }

    .ceg-card:hover .detalhes-expand,
    .ceg-card.aberto .detalhes-expand {
      max-height: 600px;
      opacity: 1;
      margin-top: 1rem;
      padding-top: 0.85rem;
    }

    .ceg-card:hover .seta-indicador,
    .ceg-card.aberto .seta-indicador {
      transform: rotate(180deg);
      color: #f43f5e;
    }

    /* Bolhas decorativas de fundo */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      z-index: -1;
      opacity: 0.55;
      animation: floatBlob 10s infinite alternate ease-in-out;
    }

    @keyframes floatBlob {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, -30px) scale(1.1); }
    }
  </style>
</head>
<body class="min-h-screen text-slate-700 p-4 md:p-8 relative">

  <!-- Decoração de Fundo -->
  <div class="blob w-72 h-72 bg-rose-200 top-[-40px] left-[-40px]"></div>
  <div class="blob w-80 h-80 bg-purple-200 bottom-[-50px] right-[-40px]" style="animation-delay: -5s;"></div>

  <div class="max-w-3xl mx-auto">
    <!-- Cabeçalho Interativo -->
    <header class="text-center my-8">
      <div class="inline-block bg-white/80 backdrop-blur-md px-4 py-1.5 rounded-full border border-rose-100 text-xs font-bold text-rose-400 mb-3 shadow-sm">
        🎀 Feito por @fbcrisimhere 🎀 
      </div>
      <h1 class="text-3xl md:text-5xl font-bold text-rose-400 mb-3 tracking-tight drop-shadow-sm transition hover:scale-105 duration-300 cursor-default">
        ⠀︵⠀𝓑ighug cegs ⠀◌Ⳋ𝅄
      </h1>
      <p class="text-slate-500 text-sm md:text-base max-w-lg mx-auto">
        Digite seu <strong>@</strong> para consultar seus itens, prazos e status das CEGs. Passe o mouse (ou toque) nos cards para expandir os detalhes!
      </p>
    </header>

    <!-- Barra de Pesquisa com Efeito Glassmorphism -->
    <div class="bg-white/90 backdrop-blur-md p-3 md:p-4 rounded-3xl shadow-lg shadow-rose-100/50 border border-rose-100 flex gap-2 mb-6 transition focus-within:ring-4 focus-within:ring-rose-200/60 focus-within:border-rose-300">
      <div class="relative w-full flex items-center">
        <span class="absolute left-4 text-rose-300 text-lg">🔍</span>
        <input 
          type="text" 
          id="userInput" 
          placeholder="Ex: @seu_user" 
          class="w-full pl-11 pr-4 py-3.5 rounded-2xl bg-rose-50/50 border border-rose-100 focus:bg-white focus:outline-none text-slate-700 font-semibold placeholder:font-normal"
          onkeypress="if(event.key === 'Enter') buscarItens()"
        >
      </div>
      <button 
        onclick="buscarItens()" 
        class="bg-gradient-to-r from-rose-400 to-pink-400 hover:from-rose-500 hover:to-pink-500 active:scale-95 text-white font-bold px-7 py-3.5 rounded-2xl transition-all duration-200 shadow-md shadow-rose-200 hover:shadow-lg hover:shadow-rose-300 cursor-pointer shrink-0">
        Buscar
      </button>
    </div>

    <!-- Estado de Carregamento -->
    <div id="loading" class="hidden text-center py-12">
      <div class="inline-block w-10 h-10 border-4 border-rose-200 border-t-rose-400 rounded-full animate-spin mb-3"></div>
      <p class="text-rose-400 font-bold animate-pulse">Procurando seus itens nas planilhas nacionais e internacionais... 💌</p>
    </div>

    <!-- Painel de Resumo e Filtros (Aparece após a busca) -->
    <div id="painelResumo" class="hidden mb-6 space-y-4">
      <div class="grid grid-cols-3 gap-3">
        <div class="bg-white/85 backdrop-blur-sm p-3.5 rounded-2xl border border-rose-100 text-center shadow-sm hover:scale-105 transition">
          <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Total de CEGs</p>
          <p id="statTotalCegs" class="text-2xl font-bold text-rose-400 mt-0.5">0</p>
        </div>
        <div class="bg-white/85 backdrop-blur-sm p-3.5 rounded-2xl border border-emerald-100 text-center shadow-sm hover:scale-105 transition">
          <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Quitadas</p>
          <p id="statQuitadas" class="text-2xl font-bold text-emerald-500 mt-0.5">0</p>
        </div>
        <div class="bg-white/85 backdrop-blur-sm p-3.5 rounded-2xl border border-amber-100 text-center shadow-sm hover:scale-105 transition">
          <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Pendentes</p>
          <p id="statPendentes" class="text-2xl font-bold text-amber-500 mt-0.5">0</p>
        </div>
      </div>

      <!-- Botões de Filtro Rápido -->
      <div class="flex flex-wrap items-center justify-between gap-2 bg-white/70 backdrop-blur-sm p-2 rounded-2xl border border-rose-100">
        <div class="flex flex-wrap gap-1.5">
          <button onclick="filtrarResultados('todos')" id="btn-todos" class="filtro-btn bg-rose-400 text-white text-xs font-bold px-3.5 py-1.5 rounded-xl transition">
            Todas
          </button>
          <button onclick="filtrarResultados('pendentes')" id="btn-pendentes" class="filtro-btn text-slate-600 hover:bg-rose-50 text-xs font-bold px-3.5 py-1.5 rounded-xl transition">
            ⏳ A Pagar
          </button>
          <button onclick="filtrarResultados('nagom')" id="btn-nagom" class="filtro-btn text-slate-600 hover:bg-rose-50 text-xs font-bold px-3.5 py-1.5 rounded-xl transition">
            📦 Na GOM
          </button>
          <button onclick="filtrarResultados('recebidos')" id="btn-recebidos" class="filtro-btn text-slate-600 hover:bg-rose-50 text-xs font-bold px-3.5 py-1.5 rounded-xl transition">
            💚 Enviados
          </button>
        </div>
        <button onclick="alternarTodosCards()" id="btnExpandirTodos" class="text-xs font-bold text-rose-400 hover:text-rose-600 px-2.5 py-1 transition cursor-pointer">
          ↕ Expandir todos
        </button>
      </div>
    </div>

    <!-- Lista de Cards de Resultados -->
    <div id="resultados" class="space-y-4"></div>
  </div>

  <script>
    const API_NACIONAL = "https://script.google.com/macros/s/AKfycbwsUFQ80dEPIcomPQsXjxJwuzFafNjmcHfT5gBLHL0pmQ4ko3-V0GtB6kPp109VMnVaqg/exec";
    const API_INTER = "https://script.google.com/macros/s/AKfycbxyMcxTzFg4lLkCslPWmY-RgxYlK_sSBd7XiOCkcL0guwcBVEZBtY9_XV1zRPJmSpG4/exec";
    
    let cacheDados = [];
    let todosExpandidos = false;

    async function buscarItens() {
      const input = document.getElementById("userInput").value.trim();
      const resultadosDiv = document.getElementById("resultados");
      const loading = document.getElementById("loading");
      const painelResumo = document.getElementById("painelResumo");

      if (!input) return;

      resultadosDiv.innerHTML = "";
      painelResumo.classList.add("hidden");
      loading.classList.remove("hidden");

      try {
        // Consulta simultânea nas duas planilhas
        const [resNacional, resInter] = await Promise.all([
          fetch(`${API_NACIONAL}?user=${encodeURIComponent(input)}`, { method: "GET", redirect: "follow" }).then(r => r.json()).catch(() => []),
          fetch(`${API_INTER}?user=${encodeURIComponent(input)}`, { method: "GET", redirect: "follow" }).then(r => r.json()).catch(() => [])
        ]);

        const dados = [...resNacional, ...resInter];
        cacheDados = dados;
        loading.classList.add("hidden");

        if (dados.length === 0) {
          resultadosDiv.innerHTML = `
            <div class="bg-white/90 p-8 rounded-3xl text-center border border-rose-100 text-slate-500 shadow-sm card-anim">
              <p class="text-3xl mb-2">🥺</p>
              Nenhum item encontrado para <strong>${input}</strong>.<br>
              <span class="text-xs text-slate-400">Verifique se digitou seu @ exatamente como está nas planilhas!</span>
            </div>`;
          return;
        }

        const total = dados.length;
        const quitadas = dados.filter(i => i.resumoPago === "Pago").length;
        const pendentes = total - quitadas;

        document.getElementById("statTotalCegs").textContent = total;
        document.getElementById("statQuitadas").textContent = quitadas;
        document.getElementById("statPendentes").textContent = pendentes;
        painelResumo.classList.remove("hidden");

        renderizarCards(dados);
      } catch (erro) {
        console.error(erro);
        loading.classList.add("hidden");
        resultadosDiv.innerHTML = `
          <div class="bg-red-50 text-red-600 p-4 rounded-2xl text-center border border-red-100">
            Erro ao conectar com as planilhas. Verifique se publicou as novas versões nos Apps Scripts.
          </div>`;
      }
    }

    function filtrarResultados(filtro) {
      document.querySelectorAll(".filtro-btn").forEach(btn => {
        btn.className = "filtro-btn text-slate-600 hover:bg-rose-50 text-xs font-bold px-3.5 py-1.5 rounded-xl transition";
      });
      document.getElementById(`btn-${filtro}`).className = "filtro-btn bg-rose-400 text-white text-xs font-bold px-3.5 py-1.5 rounded-xl transition shadow-sm";

      let filtrados = cacheDados;
      if (filtro === "pendentes") {
        filtrados = cacheDados.filter(i => i.resumoPago !== "Pago");
      } else if (filtro === "nagom") {
        filtrados = cacheDados.filter(i => i.statusEnvio === "solicitar" || i.statusEnvio === "solicitado");
      } else if (filtro === "recebidos") {
        filtrados = cacheDados.filter(i => i.statusEnvio === "recebido");
      }

      renderizarCards(filtrados);
    }

    function alternarTodosCards() {
      todosExpandidos = !todosExpandidos;
      const cards = document.querySelectorAll(".ceg-card");
      cards.forEach(card => {
        if (todosExpandidos) card.classList.add("aberto");
        else card.classList.remove("aberto");
      });
      document.getElementById("btnExpandirTodos").textContent = todosExpandidos ? "↕ Recolher todos" : "↕ Expandir todos";
    }

    function renderizarCards(lista) {
      const resultadosDiv = document.getElementById("resultados");
      resultadosDiv.innerHTML = "";

      if (lista.length === 0) {
        resultadosDiv.innerHTML = `
          <div class="bg-white/80 p-6 rounded-2xl text-center border border-rose-100 text-slate-400 text-sm">
            Nenhuma CEG encontrada neste filtro. ✨
          </div>`;
        return;
      }

      lista.

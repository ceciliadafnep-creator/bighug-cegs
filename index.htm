  <script src="https://cdn.tailwindcss.com"></script>

    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #fff5f7 0%, #fdf8f5 50%, #f5f0ff 100%);
      overflow-x: hidden;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card-anim {
      animation: fadeInUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
    }

    .ceg-card {
      transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .ceg-card:hover {
      transform: translateY(-5px) scale(1.015);
      box-shadow: 0 20px 35px -10px rgba(244, 114, 182, 0.18);
      border-color: #f9a8d4;
    }

    .detalhes-expand {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.45s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.35s ease, margin-top 0.35s ease, padding-top 0.35s ease;
    }

    .ceg-card:hover .detalhes-expand,
    .ceg-card.aberto .detalhes-expand {
      max-height: 600px;
      opacity: 1;
      margin-top: 1rem;
      padding-top: 0.85rem;
    }

    .ceg-card:hover .seta-indicador,
    .ceg-card.aberto .seta-indicador {
      transform: rotate(180deg);
      color: #f43f5e;
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      z-index: -1;
      opacity: 0.55;
      animation: floatBlob 10s infinite alternate ease-in-out;
    }

    @keyframes floatBlob {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, -30px) scale(1.1); }
    }
  </style>
</head>
